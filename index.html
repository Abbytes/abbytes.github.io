<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>AB Creative World</title>
  <meta name="description" content="Studio home. New TCG first edition is up — choose your army on the Convergence Arena."/>
  <link rel="canonical" href="https://abbytes.github.io/"/>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #09090b;
      color: #f4f1ea;
      font-family: system-ui, sans-serif;
      line-height: 1.5;
    }
    a { color: inherit; }
    .wrap { max-width: 960px; margin: 0 auto; padding: 28px 20px 64px; }
    .brand { letter-spacing: -0.02em; font-weight: 600; }
    .brand span { color: #ff8c00; font-weight: 500; }
    nav { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
    nav a {
      text-decoration: none;
      border: 1px solid #2a2824;
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 14px;
      color: #9a958c;
    }
    h1 { font-size: clamp(40px, 8vw, 72px); line-height: 0.95; font-weight: 500; margin: 36px 0 12px; letter-spacing: -0.03em; }
    .lede { max-width: 36rem; color: #9a958c; margin: 0 0 28px; }
    .card {
      display: block;
      text-decoration: none;
      border: 1px solid #2a2824;
      border-radius: 18px;
      overflow: hidden;
      background: #141417;
    }
    .card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; object-position: left top; display: block; background: #1c1c21; }
    .card div { padding: 18px 18px 20px; }
    .kicker { color: #ff8c00; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; margin: 0; }
    h2 { margin: 8px 0; font-size: 32px; letter-spacing: -0.03em; }
    .card p { margin: 0; color: #9a958c; }
    .play {
      display: inline-flex;
      margin-top: 16px;
      background: #ff8c00;
      color: #1a0e00;
      text-decoration: none;
      font-weight: 600;
      border-radius: 999px;
      min-height: 44px;
      align-items: center;
      padding: 0 18px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">AB Creative <span>World</span></div>
    <nav>
      <a href="/work/">Work</a>
      <a href="/projects/new-tcg/">New TCG</a>
      <a href="/projects/apex/">APEX</a>
      <a href="/aether/">Aether</a>
      <a href="/tip/">Tip</a>
    </nav>
    <h1>The house is still open.</h1>
    <p class="lede">New TCG is the first edition — a 20-card battle on the Convergence Arena. Storm, Fire, Earth, and Water.</p>
    <a class="card" href="/projects/new-tcg/">
      <img src="https://muse.ai/s/new-tcg-jxa63shzxpxa77/preview-image" alt="New TCG first edition creature collection"/>
      <div>
        <p class="kicker">New drop</p>
        <h2>New TCG</h2>
        <p>Choose your army. Defeat the rival leader.</p>
      </div>
    </a>
    <a class="play" href="https://muse.ai/s/new-tcg-jxa63shzxpxa77">Play on Muse</a>
  </div>
</body>
</html>
