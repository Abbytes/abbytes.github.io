<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Live — Ab Creative World</title>
<meta name="description" content="Watch Sparta Adamo live from AB Creative World."/>
<meta property="og:image" content="https://abbytes.github.io/og-home.png"/>
<style>
:root{--gold:#ead9b4;--amber:#ff8c00;--bg:#0b0c0f;--live:#ff3b30;--muted:#8b93a7}
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:#e8eaef;font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;height:100%}
a{color:inherit;text-decoration:none}
body{display:flex;flex-direction:column;min-height:100dvh}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:rgba(11,12,15,.88);border-bottom:1px solid rgba(255,255,255,.1);backdrop-filter:blur(12px)}
.brand{font-weight:700}.brand small{margin-left:6px;letter-spacing:.18em;text-transform:uppercase;color:#888;font-size:10px}
.nav{display:flex;gap:6px;overflow-x:auto}
.nav a,.nav button{border:0;background:transparent;color:#ddd;border-radius:999px;padding:8px 12px;font-size:12px;white-space:nowrap}
.nav a.on,.nav button.on{background:rgba(255,255,255,.15);color:#fff}
.status{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 14px;border-bottom:1px solid rgba(255,255,255,.08);background:#050505}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.badge.live{background:var(--live);color:#fff}
.badge.off{border:1px solid rgba(255,255,255,.15);color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45;transform:scale(.75)}}
.meta{min-width:0}.meta b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta span{display:block;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.actions{display:flex;gap:8px;flex-shrink:0}
.btn{display:inline-flex;align-items:center;min-height:40px;border-radius:999px;padding:0 14px;font-size:12px;font-weight:700}
.btn.primary{background:var(--amber);color:#140b00}
.btn.ghost{border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05)}
.stage{flex:1;display:flex;min-height:0}
.player{position:relative;flex:1;background:#000;min-height:220px}
.player iframe,.chat iframe{width:100%;height:100%;border:0;background:#000}
.chat{width:340px;background:#0e0e10;border-left:1px solid rgba(255,255,255,.08)}
.curtain{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:20px;background:linear-gradient(to top,rgba(0,0,0,.9),rgba(0,0,0,.25) 55%,transparent);pointer-events:none}
.card{pointer-events:auto;width:min(420px,100%);text-align:center;border:1px solid rgba(234,217,180,.28);border-radius:18px;background:rgba(0,0,0,.78);padding:22px 18px}
.logo{font-family:Georgia,serif;letter-spacing:.28em;color:var(--gold);font-size:42px;line-height:.9}
.word{margin-top:6px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);font-size:11px}
.line{width:120px;height:1px;margin:12px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.foot{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.08);background:#050505}
@media(max-width:860px){
  .stage{flex-direction:column}
  .player{aspect-ratio:16/9;flex:none}
  .chat{display:none;width:100%;height:42vh;border-left:0;border-top:1px solid rgba(255,255,255,.08)}
  .chat.open{display:block}
}
</style>
</head>
<body>
<div class="top">
  <a class="brand" href="/">AB <small>Live</small></a>
  <nav class="nav">
    <a href="/">Home</a>
    <a class="on" href="/live/">Live</a>
    <a href="/work/">Work</a>
    <a href="/tip/">Tip</a>
  </nav>
  <a class="btn primary" href="https://www.twitch.tv/spartaadamo" target="_blank" rel="noopener">Follow</a>
</div>
<div class="status">
  <div style="display:flex;gap:12px;align-items:center;min-width:0">
    <span id="badge" class="badge off">Offline</span>
    <div class="meta">
      <b id="title">Sparta Adamo</b>
      <span id="sub">twitch.tv/spartaadamo</span>
    </div>
  </div>
  <div class="actions">
    <button class="btn ghost" id="chatBtn" type="button">Chat</button>
  </div>
</div>
<div class="stage">
  <div class="player">
    <iframe id="player" allowfullscreen allow="autoplay; fullscreen; picture-in-picture; encrypted-media" title="Sparta Adamo on Twitch"></iframe>
    <div class="curtain" id="curtain">
      <div class="card">
        <div class="logo">AB</div>
        <div class="word">Creative World</div>
        <div class="line"></div>
        <div class="word">Starting soon</div>
        <p style="color:#8b93a7;font-size:14px;margin:10px 0 14px">Channel is offline right now. Follow so you catch the next drop.</p>
        <a class="btn primary" href="https://www.twitch.tv/spartaadamo" target="_blank" rel="noopener">Follow on Twitch</a>
      </div>
    </div>
  </div>
  <aside class="chat" id="chat"><iframe id="chatFrame" title="Twitch chat"></iframe></aside>
</div>
<div class="foot">
  <a class="btn ghost" href="https://www.twitch.tv/spartaadamo" target="_blank" rel="noopener">Open on Twitch</a>
  <a class="btn ghost" href="https://discord.gg/jezxbGAaR" target="_blank" rel="noopener">Discord</a>
  <a class="btn primary" href="/tip/">Tip the studio</a>
  <a class="btn ghost" href="/live/studio.html">Stream overlays</a>
</div>
<script>
const CHANNEL = "spartaadamo";
function parents() {
  const hosts = new Set(["abbytes.github.io", location.hostname, "localhost"]);
  try { if (document.referrer) hosts.add(new URL(document.referrer).hostname); } catch (e) {}
  if (location.ancestorOrigins) {
    for (const origin of location.ancestorOrigins) {
      try { hosts.add(new URL(origin).hostname); } catch (e) {}
    }
  }
  return [...hosts].filter(Boolean).map(h => "parent=" + encodeURIComponent(h)).join("&");
}
function mountEmbeds() {
  const q = parents();
  document.getElementById("player").src =
    "https://player.twitch.tv/?channel=" + CHANNEL + "&" + q + "&autoplay=true&muted=false";
  document.getElementById("chatFrame").src =
    "https://www.twitch.tv/embed/" + CHANNEL + "/chat?" + q + "&darkpopout";
}
async function poll() {
  try {
    const [uptime, game, title] = await Promise.all([
      fetch("https://decapi.me/twitch/uptime/" + CHANNEL, { cache: "no-store" }).then(r => r.text()),
      fetch("https://decapi.me/twitch/game/" + CHANNEL, { cache: "no-store" }).then(r => r.text()),
      fetch("https://decapi.me/twitch/title/" + CHANNEL, { cache: "no-store" }).then(r => r.text()),
    ]);
    const live = uptime && !/offline/i.test(uptime);
    const badge = document.getElementById("badge");
    const curtain = document.getElementById("curtain");
    badge.className = "badge " + (live ? "live" : "off");
    badge.innerHTML = live ? '<span class="dot"></span>Live' : "Offline";
    document.getElementById("title").textContent = live && title && !/offline/i.test(title) ? title.trim() : "Sparta Adamo";
    document.getElementById("sub").textContent = live
      ? [game && !/offline/i.test(game) ? game.trim() : "", uptime.trim()].filter(Boolean).join(" · ")
      : "twitch.tv/" + CHANNEL;
    curtain.style.display = live ? "none" : "flex";
  } catch (e) {}
}
document.getElementById("chatBtn").onclick = function () {
  document.getElementById("chat").classList.toggle("open");
};
mountEmbeds();
poll();
setInterval(poll, 45000);
</script>
</body>
</html>
